name: gas_detector_app
description: IoT Gas Detection System Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mobile_scanner: ^7.1.0  # ✅ Use the latest version for Android 14 support
  permission_handler: ^11.3.1 # Add this line
  
  # MOVE THIS OUT: These must be aligned with 'flutter:'
  flutter_dotenv: ^5.1.0  

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_database: ^12.1.1
  firebase_messaging: ^16.1.0
  
  # State Management
  provider: ^6.1.1
  
  google_sign_in: ^6.2.1

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  fl_chart: ^1.1.1
  syncfusion_flutter_gauges: ^32.1.21
  flutter_spinkit: ^5.2.0
  intl: ^0.20.2
  qr_code_scanner: ^1.0.1
  http: ^1.1.0
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  
  # Utilities
  shared_preferences: ^2.3.5
  connectivity_plus: ^7.0.0
  url_launcher: ^6.2.2
  
  # Icons
  font_awesome_flutter: ^10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.3" # Use the latest version

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/gas_detector_logo.png"
  # Optional: For professional Android Adaptive Icons
  adaptive_icon_background: "#FFFFFF" # Or a background image path
  adaptive_icon_foreground: "assets/icon/gas_detector_logo.png"

flutter:
  uses-material-design: true
  
  # MOVE THIS HERE: The assets section belongs under the top-level 'flutter:' key
  assets:
    - .env
