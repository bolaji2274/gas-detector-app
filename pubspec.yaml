name: gas_detector_app
description: IoT Gas Detection System Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  # firebase_core: ^2.24.2
  # firebase_auth: ^4.15.3
  # firebase_database: ^10.3.8
  # firebase_messaging: ^14.7.9
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_database: ^12.1.1
  firebase_messaging: ^16.1.0
