name: Gas Detector App Release

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    # Required to allow the action to create a Release
    permissions:
      contents: write

    steps:
      # 1. Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Extract Version from pubspec.yaml
      - name: Get Version info
        id: get_version
        run: |
          # Extract version name (e.g., 1.0.1)
          VERSION_NAME=$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV
      # 2. Set up Java (required for Android builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Decode Keystore and create key.properties
      - name: Prepare Signing
        run: |
          # 1. Create the key.properties in the /android folder
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          
          # 2. SET THIS TO FILENAME ONLY (Important!)
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          
          # 3. Decode the keystore file INTO the android/app folder
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      # 5. Build the Release APK
      - name: Build APK
        run: |
            flutter build apk --release \
              --build-name=${{ env.APP_VERSION }} \
              --build-number=${{ env.BUILD_NUMBER }}

      # 6. Upload the APK as a GitHub Action Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gas-detector-v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/app-release.apk

    #   Generate Changelog since the last release
      - name: Generate Changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      # 7. (Optional) Create a GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        # if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Gas Detector ${{ env.APP_VERSION }} (Build ${{ github.run_number }})"
          body: |
            ## What's New in this Build
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}