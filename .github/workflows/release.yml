name: Gas Detector App Release

on:
  push:
    branches:
    #   - development
      - main
    # ONLY trigger if files in these folders change:
    paths:
      - 'lib/**'          # Any Dart code
      - 'pubspec.yaml'    # Version or dependency changes
      - 'android/**'      # Native Android changes
      - 'assets/**'       # New icons or images
    # IGNORE these files even if they are pushed to main:
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
      - '.gitignore'

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    # Required to allow the action to create a Release
    permissions:
      contents: write

    steps:
      # 1. Checkout the code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Extract Version from pubspec.yaml
      - name: Get Version info
        id: get_version
        run: |
          # 1. Pull the version line from pubspec.yaml (e.g., version: 1.0.0+1)
          # 2. Extract just the '1.0.0' part
          VERSION_NAME=$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          
          # 3. Create a unique Tag Name
          TAG_NAME="v$VERSION_NAME-build${{ github.run_number }}"
          
          # 4. Save these to $GITHUB_ENV so other steps can use them
          echo "APP_VERSION=$VERSION_NAME" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          
          # Optional: Log it so you can see it in the GitHub console
          echo "App Version is: $VERSION_NAME"
          echo "Unique Tag is: $TAG_NAME"
      # 2. Set up Java (required for Android builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Decode Keystore and create key.properties
      - name: Prepare Signing
        run: |
          # 1. Create the key.properties in the /android folder
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          
          # 2. SET THIS TO FILENAME ONLY (Important!)
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          
          # 3. Decode the keystore file INTO the android/app folder
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
      # Cache Gradle dependencies for faster Android builds
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      # 5. Build the Release APK
      - name: Build APK
        run: |
            flutter build apk --release \
              --build-name=${{ env.APP_VERSION }} \
              --build-number=${{ env.BUILD_NUMBER }}

      # 6. Upload the APK as a GitHub Action Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gas-detector-v${{ env.APP_VERSION }}-b${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/app-release.apk

    #   Generate Changelog since the last release
      - name: Generate Changelog
        id: changelog
        uses: metcalfc/changelog-generator@v4.3.1
        with:
          myToken: ${{ secrets.GITHUB_TOKEN }}
      # 7. (Optional) Create a GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        # if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Gas Detector ${{ env.APP_VERSION }} (Build ${{ github.run_number }})"
          body: |
            ## What's New in this Build
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 6. Delete older releases (keep only the latest 5)
      - name: Prune Old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 5
          delete_tags: true # Also removes the old Git tags to keep the repo clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}